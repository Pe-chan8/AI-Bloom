version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_bloom_development
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "bin/rails solid_queue:start"
    volumes:
      - .:/app
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      TZ: Asia/Tokyo
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0 -p 3000"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      TZ: Asia/Tokyo
      AI_DEBUG: "1"
      AI_DEBUG_BODY: "0"
      AI_RECENT_TURNS: "2"
      AI_REPLY_MAX_TOKENS: "350"
    restart: unless-stopped

volumes:
  db-data:
